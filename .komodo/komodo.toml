# Komodo deploy of the Acerola Sync server (acerola-sync/server) on the hetzner server.
# Names follow <server>_<app>; Swarm completes the services with _<service> (hetzner_acerola-sync_server).
#
#   Sync       applies this file (GitHub webhook on push to main).
#   Repo       clone of main on the hetzner server; Build and Stack read from it.
#   Build      acerola-sync/server/.config/docker/dockerfile built ON the hetzner server itself.
#              No registry: the image stays local as acerola-sync:<short commit>-hetzner.
#   Stack      .komodo/acerola-sync.compose.yml on the hetzner Swarm; komodo.sh runs the deploy steps
#              and route.sh publishes acerola-sync.caddy (api.sync.acerola.app) on the server's Caddy.
#   Procedure  Pull -> Build -> Deploy, triggered by the GitHub webhook
#              (/listener/github/procedure/hetzner_acerola-sync/main).
#   Action     native Swarm rollback to the previous version.
#
# Secrets are Komodo Variables (secret): ACEROLA_SYNC_DATABASE_URL, ACEROLA_SYNC_ENCRYPTION_KEY.
# The database is the `postgres` Deployment of the config repo (configuration/apps/postgres), on
# the same edge network: postgres://acerola_sync:<ACEROLA_SYNC_DB_PASSWORD>@postgres:5432/acerola_sync.

[[resource_sync]]
name = "acerola-sync"
description = "Aplica o deploy do Acerola Sync (.komodo/komodo.toml do acerola-sync)"
tags = ["env:hetzner", "app:acerola-sync"]
[resource_sync.config]
git_provider = "github.com"
repo = "acerola-labs/acerola-sync"
branch = "main"
resource_path = [".komodo/komodo.toml"]
delete = false

[[repo]]
name = "hetzner_acerola-sync"
description = "Clone da main do acerola-sync no hetzner"
tags = ["env:hetzner", "app:acerola-sync"]
[repo.config]
server = "hetzner"
git_provider = "github.com"
repo = "acerola-labs/acerola-sync"
branch = "main"
webhook_enabled = false
links = ["https://github.com/acerola-labs/acerola-sync/tree/main/acerola-sync/server"]

[[build]]
name = "hetzner_acerola-sync"
description = "Imagem do server do Acerola Sync, construída no próprio hetzner (sem registry)"
tags = ["env:hetzner", "app:acerola-sync"]
[build.config]
builder = "hetzner"
linked_repo = "hetzner_acerola-sync"
webhook_enabled = false
build_path = "acerola-sync/server"
dockerfile_path = ".config/docker/dockerfile"
image_name = "acerola-sync"
image_tag = "hetzner"
include_latest_tag = false
include_version_tags = false
include_commit_tag = true
labels = """
org.opencontainers.image.source=https://github.com/acerola-labs/acerola-sync
acerola.app=acerola-sync
acerola.server=hetzner
"""
links = ["https://api.sync.acerola.app"]

[[stack]]
name = "hetzner_acerola-sync"
description = "Server do Acerola Sync no Swarm do hetzner"
tags = ["env:hetzner", "app:acerola-sync"]
[stack.config]
swarm = "hetzner"
project_name = "hetzner_acerola-sync"
linked_repo = "hetzner_acerola-sync"
webhook_enabled = false
run_directory = ".komodo"
file_paths = ["acerola-sync.compose.yml"]
extra_args = ["--resolve-image", "never", "--detach=false"]
links = ["https://api.sync.acerola.app"]
pre_deploy.command = "sh komodo.sh pre-deploy acerola-sync hetzner"
compose_cmd_wrapper_include = ["config", "deploy"]
compose_cmd_wrapper = '''
DATABASE_URL='[[ACEROLA_SYNC_DATABASE_URL]]' \
ENCRYPTION_KEY='[[ACEROLA_SYNC_ENCRYPTION_KEY]]' \
ANILIST_CLIENT_ID='56273' \
ALLOWED_ANILIST_USER_ID='6881079' \
sh komodo.sh deploy acerola-sync hetzner [[COMPOSE_COMMAND]]
'''
post_deploy.command = "sh komodo.sh post-deploy acerola-sync hetzner"

[[procedure]]
name = "hetzner_acerola-sync"
description = "Publica a main do Acerola Sync no hetzner: Pull, Build e Deploy"
tags = ["env:hetzner", "app:acerola-sync"]
[procedure.config]
webhook_enabled = true

[[procedure.config.stage]]
name = "Pull"
executions = [
  { execution.type = "PullRepo", execution.params.repo = "hetzner_acerola-sync" },
]

[[procedure.config.stage]]
name = "Build"
executions = [
  { execution.type = "RunBuild", execution.params.build = "hetzner_acerola-sync" },
]

[[procedure.config.stage]]
name = "Deploy"
executions = [
  { execution.type = "DeployStack", execution.params.stack = "hetzner_acerola-sync" },
]

[[action]]
name = "hetzner_acerola-sync_rollback"
description = "Volta o server do Acerola Sync para a versão anterior (rollback do Swarm)"
tags = ["env:hetzner", "app:acerola-sync"]
[action.config]
webhook_enabled = false
file_contents = '''
const stack = 'hetzner_acerola-sync';
await komodo.execute_server_terminal(
  {
    server: 'hetzner',
    command: `docker service ls -q --filter label=com.docker.stack.namespace=${stack} | xargs -r -n1 docker service rollback --detach=false`,
    init: { command: 'sh' },
  },
  { onLine: (line) => console.log(line), onFinish: (code) => console.log(`exit ${code}`) },
);
'''
