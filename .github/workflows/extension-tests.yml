name: 'Tests/Extension'

on:
  push:
    branches: [develop, main]
    paths:
      - 'acerola-sync/extension/**'
      - 'acerola-sync/package*.json'
      - 'scripts/**'
      - 'acerola.config.json'
      - '.github/workflows/extension-tests.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'acerola-sync/extension/**'
      - 'acerola-sync/package*.json'
      - 'scripts/**'
      - 'acerola.config.json'
      - '.github/workflows/extension-tests.yml'
  workflow_dispatch:

concurrency:
  group: extension-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types, design, i18n and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acerola-sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 25.9.0
          cache: npm
          cache-dependency-path: acerola-sync/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (prettier, design and i18n)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Standard scripts tests
        run: npm run test:design && npm run test:release

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
