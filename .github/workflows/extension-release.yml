name: "Release/Extension"

# Tag `extension/vX.Y.Z` (or `extension/vX.Y.Z-rc.N`, published as a pre-release), made on the
# release merge on `main`. The version is written in the release branch (`release/X.Y.Z`,
# `scripts/release/bump.mjs`): the tag must match `extension/package.json`. Builds the Chrome and
# Firefox zips and publishes the GitHub Release titled `Versão X.Y.Z`, with the version's section of
# `extension/RELEASE.md` and the install steps below it. `workflow_dispatch` republishes an existing
# tag (input `tag`).

on:
  push:
    tags:
      - 'extension/v[0-9]+.[0-9]+.[0-9]+'
      - 'extension/v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to republish (extension/vX.Y.Z)'
        required: true
        type: string

concurrency:
  group: extension-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: acerola-sync

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Check tag is on main
        working-directory: ${{ github.workspace }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$(git rev-parse "$RELEASE_TAG^{commit}")" origin/main \
            || { echo "::error::Tag $RELEASE_TAG is not on main"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 25.9.0
          cache: npm
          cache-dependency-path: acerola-sync/package-lock.json

      - name: Extract version
        run: node ../scripts/release/bump.mjs --tag "$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Check the tag against package.json
        run: |
          pkg=$(node -p "require('./extension/package.json').version")
          [ "$pkg" = "$VERSION" ] \
            || { echo "::error::Tag $RELEASE_TAG differs from extension/package.json version $pkg"; exit 1; }

      # The release text is the version's section in extension/RELEASE.md (acerola-git 5): without
      # it the release stops here, before the build.
      - name: Release notes
        working-directory: ${{ github.workspace }}
        run: |
          node scripts/release/release-notes.mjs "${VERSION%%-*}" acerola-sync/extension/RELEASE.md > "$RUNNER_TEMP/notes.md"
          echo >> "$RUNNER_TEMP/notes.md"
          sed "s/{{VERSION}}/${VERSION}/g" .github/release/extension.md >> "$RUNNER_TEMP/notes.md"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test -w extension

      # The private key stays in the secret; the manifest gets the public one (the fixed id comes from it).
      - name: Extension key
        env:
          EXTENSION_KEY: ${{ secrets.EXTENSION_KEY }}
        run: |
          test -n "$EXTENSION_KEY" || { echo "::error::Missing secret EXTENSION_KEY"; exit 1; }
          PUBLIC=$(printf '%s\n' "$EXTENSION_KEY" | openssl pkey -pubout -outform DER | base64 -w0)
          echo "EXTENSION_PUBLIC_KEY=$PUBLIC" >> "$GITHUB_ENV"

      - name: Build zips (Chrome and Firefox)
        working-directory: acerola-sync/extension
        run: |
          npm run zip
          npm run zip:firefox
          ls -la .output/*.zip

      # With the gh CLI of the runner: the organization only allows GitHub-owned actions.
      - name: Publish the GitHub release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zips=(acerola-sync/extension/.output/*-chrome.zip acerola-sync/extension/.output/*-firefox.zip)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Versão ${VERSION}" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$RELEASE_TAG" "${zips[@]}" --clobber
          else
            args=(--verify-tag --title "Versão ${VERSION}" --notes-file "$RUNNER_TEMP/notes.md")
            [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
            gh release create "$RELEASE_TAG" "${args[@]}" "${zips[@]}"
          fi
