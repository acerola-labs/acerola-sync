name: "Release/Extension"

# Tag `extension/vX.Y.Z` (or `extension/vX.Y.Z-rc.N`, published as a pre-release). Bumps
# `extension/package.json`, builds the Chrome and Firefox zips, pushes the bump back to `main` and
# `develop` and publishes the GitHub Release with the zips. `workflow_dispatch` republishes an
# existing tag (input `tag`).
#
# The bump is pushed with the job's GITHUB_TOKEN (`contents: write`): a push made with it fires
# no other workflow, and the Komodo webhook still fires.

on:
  push:
    tags:
      - 'extension/v[0-9]+.[0-9]+.[0-9]+'
      - 'extension/v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to republish (extension/vX.Y.Z)'
        required: true
        type: string

concurrency:
  group: extension-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: acerola-sync

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Check tag is on main
        working-directory: ${{ github.workspace }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$(git rev-parse "$RELEASE_TAG^{commit}")" origin/main \
            || { echo "::error::Tag $RELEASE_TAG is not on main"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 25.9.0
          cache: npm
          cache-dependency-path: acerola-sync/package-lock.json

      - name: Extract version
        run: node ../scripts/release/bump.mjs --tag "$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        run: node ../scripts/release/bump.mjs extension "$VERSION"

      - name: Test
        run: npm run test -w extension

      # The private key stays in the secret; the manifest gets the public one (the fixed id comes from it).
      - name: Extension key
        env:
          EXTENSION_KEY: ${{ secrets.EXTENSION_KEY }}
        run: |
          test -n "$EXTENSION_KEY" || { echo "::error::Missing secret EXTENSION_KEY"; exit 1; }
          PUBLIC=$(printf '%s\n' "$EXTENSION_KEY" | openssl pkey -pubout -outform DER | base64 -w0)
          echo "EXTENSION_PUBLIC_KEY=$PUBLIC" >> "$GITHUB_ENV"

      - name: Build zips (Chrome and Firefox)
        working-directory: acerola-sync/extension
        run: |
          npm run zip
          npm run zip:firefox
          ls -la .output/*.zip

      - name: Commit version bump
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add acerola-sync/extension/package.json
          if git diff --staged --quiet; then
            echo "Version already at ${VERSION}: nothing to commit."
            exit 0
          fi
          git commit -m "[build](extension): Versão ${VERSION} [skip ci]"
          BUMP_SHA=$(git rev-parse HEAD)
          git checkout -- .

          # Retries only cover a concurrent push (non fast-forward); anything else fails fast.
          push() {
            local branch=$1 attempt=0
            until git push origin "HEAD:$branch"; do
              attempt=$((attempt + 1))
              [ "$attempt" -lt 5 ] || { echo "::error::Could not push the version bump to $branch"; exit 1; }
              git fetch origin "$branch"
              git checkout -- .
              git rebase "origin/$branch"
            done
          }

          push main

          git fetch origin develop
          git checkout -B develop origin/develop
          git cherry-pick "$BUMP_SHA"
          git checkout -- .
          push develop

      # The text comes from `.github/release/extension.md` (highlights and install steps); the
      # change list generated by GitHub goes below it.
      - name: Release notes
        working-directory: ${{ github.workspace }}
        run: sed "s/{{VERSION}}/${VERSION}/g" .github/release/extension.md > "$RUNNER_TEMP/notes.md"

      # With the gh CLI of the runner: the organization only allows GitHub-owned actions.
      - name: Create GitHub Release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--title "Acerola Sync ${VERSION}" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes)
          [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
          gh release create "$RELEASE_TAG" "${args[@]}" \
            acerola-sync/extension/.output/*-chrome.zip \
            acerola-sync/extension/.output/*-firefox.zip
