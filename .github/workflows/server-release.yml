name: "Release/Server"

# Tag `server/vX.Y.Z`. Only bumps `server/Cargo.toml` (and Cargo.lock) and pushes the commit back
# to `main` and `develop`. No Release or image: the push to `main` triggers the Komodo deploy
# (.komodo/komodo.toml).

on:
  push:
    tags:
      - 'server/v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  group: server-release
  cancel-in-progress: false

jobs:
  bump:
    name: Bump version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: acerola-sync

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0

      - name: Check tag is on main
        working-directory: ${{ github.workspace }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Tag $GITHUB_REF_NAME is not on main"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 25.9.0

      - name: Extract version
        run: node ../scripts/release/bump.mjs --tag "$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Bump version
        run: node ../scripts/release/bump.mjs server "$VERSION"

      - name: Commit version bump
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add acerola-sync/server/Cargo.toml acerola-sync/server/Cargo.lock
          if ! git diff --staged --quiet; then
            git commit -m "[build](backend): Versão ${VERSION} [skip ci]"
            BUMP_SHA=$(git rev-parse HEAD)
            git checkout -- .

            until git push origin HEAD:main; do
              git fetch origin main
              git checkout -- .
              git rebase origin/main
            done

            git fetch origin develop
            git checkout -B develop origin/develop
            git cherry-pick "$BUMP_SHA"
            git checkout -- .
            until git push origin develop; do
              git fetch origin develop
              git checkout -- .
              git rebase origin/develop
            done
          fi
