name: "Release/Server"

# Tag `server/vX.Y.Z`, made on the release merge on `main` (that merge is what deploys the server:
# Komodo, .komodo/komodo.toml). The version is written in the release branch (`release/X.Y.Z`,
# `scripts/release/bump.mjs`): the tag must match `server/Cargo.toml`. Publishes the GitHub Release
# titled `Versão X.Y.Z`, with the version's section of `server/RELEASE.md`. `workflow_dispatch`
# republishes an existing tag (input `tag`).

on:
  push:
    tags:
      - 'server/v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to republish (server/vX.Y.Z)'
        required: true
        type: string

concurrency:
  group: server-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: acerola-sync

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Check tag is on main
        working-directory: ${{ github.workspace }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$(git rev-parse "$RELEASE_TAG^{commit}")" origin/main \
            || { echo "::error::Tag $RELEASE_TAG is not on main"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 25.9.0

      - name: Extract version
        run: node ../scripts/release/bump.mjs --tag "$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Check the tag against Cargo.toml
        run: |
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' server/Cargo.toml | head -n 1)
          [ "$cargo" = "$VERSION" ] \
            || { echo "::error::Tag $RELEASE_TAG differs from server/Cargo.toml version $cargo"; exit 1; }

      # The release text is the version's section in server/RELEASE.md (acerola-git 5).
      - name: Release notes
        working-directory: ${{ github.workspace }}
        run: node scripts/release/release-notes.mjs "$VERSION" acerola-sync/server/RELEASE.md > "$RUNNER_TEMP/notes.md"

      # With the gh CLI of the runner: the organization only allows GitHub-owned actions.
      - name: Publish the GitHub release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Versão ${VERSION}" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "Versão ${VERSION}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
