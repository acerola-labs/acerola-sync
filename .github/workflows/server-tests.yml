name: 'Tests/Server'

on:
  push:
    branches: [develop, main]
    paths:
      - 'acerola-sync/server/**'
      - '.github/workflows/server-tests.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'acerola-sync/server/**'
      - '.github/workflows/server-tests.yml'
  workflow_dispatch:

concurrency:
  group: server-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format, clippy and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acerola-sync/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The acerola-labs organization only allows GitHub-owned actions, pinned by SHA: the toolchain
      # comes from the runner's rustup and the cache from actions/cache.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Rust cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            acerola-sync/server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('acerola-sync/server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test
